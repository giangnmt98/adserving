# YAML
mlflow:
  # URL MLflow Tracking Server
  # Env override: MLFLOW_TRACKING_URI
  tracking_uri: "http://localhost:5000"

ray:
  # Địa chỉ Ray cluster (ví dụ: "ray://host:10001" hoặc "auto")
  # Env override: RAY_ADDRESS
  address:

  # Số CPU/GPU cho Ray (optional)
  num_cpus: 10
  num_gpus: 0
  # runtime_env: {} # tuỳ chọn

  # Ray Dashboard host/port (optional)
  # Env override: RAY_DASHBOARD_HOST / RAY_DASHBOARD_PORT
  dashboard_host: "0.0.0.0"
  dashboard_port: 8265

serve:
  # Cấu hình HTTP của Ray Serve (cổng và host cho endpoint HTTP của Serve)
  http:
    # Env override: SERVE_HTTP_HOST
    host: "0.0.0.0"
    # Env override: SERVE_HTTP_PORT
    port: 8001

  autoscaling:
    min_replicas: 2
    max_replicas: 8
    target_num_ongoing_requests_per_replica: 12

  deployment:
    num_cpus: 1
    memory_mb: 2048

preload:
  # Giới hạn số model load song song khi khởi động
  max_load_concurrency: 8

watcher:
  # Kiểm tra Production models định kỳ (giây)
  interval_seconds: 60
  # Bật sanity check trước khi swap model (tuỳ chọn)
  sanity_check_enabled: false
  # Danh sách input sanity test (tuỳ chọn)
  sanity_inputs: []  # ví dụ: [0.0, 1.0]

logging:
  level: "INFO"

monitoring:
  enabled: true
  collection_interval: 30
  optimization_interval: 300

security:
  enable_cors: true

# YAML
audit:
  enabled: true
  sampling:
    training_rate: 0.2
    inference_rate: 1.0
  redact_pii: true

redis:
  host: "127.0.0.1"
  port: 6379
  db: 0
  password: "DsteamIC2025"
  socket_timeout: 0.1
  socket_connect_timeout: 0.05
  retry_on_timeout: true
  streams:
    training_data: "training_data"
    inference_results: "inference_results"
    dlq: "audit_dlq"
    max_stream_length: 1000000
  consumer:
    group_name: "adserving_consumers"
    training_consumer_prefix: "trainw"
    inference_consumer_prefix: "inferw"
    batch_size: 200
    block_time_ms: 100
    max_retries: 5
    idle_timeout_ms: 30000

database:
  host: "127.0.0.1"
  port: 5432
  name: "postgres"
  user: "admin"
  password: "admin"
  min_connections: 5
  max_connections: 20
  command_timeout: 60

ray_workers:
  training_workers: 2
  inference_workers: 2
  flush_interval_ms: 200

api:
  # Host/port FastAPI (uvicorn)
  # Env override: FASTAPI_HOST hoặc API_HOST (back-compat)
  host: "0.0.0.0"
  # Env override: FASTAPI_PORT hoặc API_PORT (back-compat)
  port: 8000

  # Prefix/version tài liệu API
  prefix: "/api/v1"
  version: "v1.0"
  docs: true
  openapi: true