# =============================================================================
# ANOMALY DETECTION SERVE - COMPLETE CONFIGURATION
# Enhanced configuration for serving hundreds of ML models with Ray Model Router System
# =============================================================================

# 1. API Settings
api_host: "0.0.0.0"              # Bind tất cả interfaces (0.0.0.0 = all)
api_port: 8000                   # Port chính của FastAPI service
api_prefix: "/api/v1"            # URL prefix cho tất cả endpoints
api_version: "v1.0"              # Version hiển thị trong docs
enable_docs: true                # Bật Swagger/OpenAPI docs
enable_openapi: true             # Bật OpenAPI specification

# 2. Ray Cluster - Hạ tầng tính toán phân tán với Comprehensive Hardware Configuration
ray:
  # Basic Ray cluster settings
  address: null                  # null = local cluster, "ray://host:port" = remote
  dashboard_host: "127.0.0.1"    # Ray dashboard web UI host
  dashboard_port: 8265           # Ray dashboard port (http://localhost:8265)
  log_level: "INFO"              # Ray internal logging (DEBUG/INFO/WARNING/ERROR)
  runtime_env: null              # Python dependencies, env vars for Ray workers
  
  # Memory Configuration - Enhanced memory management
  object_store_memory: "8GB"     # Shared object store memory for model weights/data
  heap_memory_limit: "4GB"       # Maximum heap memory per worker
  enable_memory_pressure_eviction: true  # Evict objects under memory pressure
  memory_usage_threshold: 0.98   # Memory usage threshold for warnings (98%)
  enable_spill_to_disk: false    # Spill objects to disk when memory is full
  disk_spill_directory: "/tmp/ray_spill"  # Directory for disk spilling
  max_disk_spill_size: "10GB"    # Maximum disk spill size
  
  # CPU Hardware Configuration - Advanced CPU control
  num_cpus: 20                   # Number of CPU cores (null = auto-detect)
  cpu_scheduling_policy: "SCHED_OTHER"  # CPU scheduling: SCHED_OTHER/SCHED_FIFO/SCHED_RR/SCHED_BATCH
  enable_cpu_affinity: true      # Enable CPU core affinity for Ray workers
  cpu_affinity_cores: "0-19"     # Specific cores like "0-7", "0,2,4,6" or null for auto
  cpu_nice_priority: 0           # Process nice priority (-20 to 19, lower = higher priority)
  enable_numa_optimization: true # NUMA topology optimization
  numa_nodes: "0,1"              # Specific NUMA nodes like "0,1" or "0-3" or null for auto
  cpu_overcommit_factor: 1.2     # CPU overcommitment factor (1.0 = no overcommit, 1.2 = 20% overcommit)
  
  # GPU Hardware Configuration - Complete GPU control
  num_gpus: 0                    # Number of GPU devices (null = auto-detect, 0 = no GPUs)
  gpu_devices: null              # Specific GPU devices like "0,1,2", "all", or null for auto
  gpu_memory_fraction: 0.8       # Fraction of GPU memory to use per device (80%)
  enable_gpu_sharing: true       # Allow multiple actors per GPU
  gpu_scheduling_strategy: "round_robin"  # GPU scheduling: round_robin/least_used/explicit
  gpu_memory_pool_size: null     # Pre-allocated GPU memory pool (e.g., "2GB")
  enable_gpu_memory_fraction_per_device: false  # Per-device memory fractions
  gpu_device_memory_fractions:   # Per-device memory fractions {gpu_id: fraction}
    0: 0.8                       # GPU 0 uses 80% of its memory
    1: 0.9                       # GPU 1 uses 90% of its memory
  enable_gpu_compute_capability_check: true  # Check GPU compute capability
  min_gpu_compute_capability: 3.5  # Minimum required compute capability
  
  # Performance and Optimization - Advanced performance tuning
  enable_placement_group_bundle_cache: true  # Cache placement group bundles
  placement_group_capture_child_tasks: true  # Capture child tasks in placement groups
  enable_task_events: false      # Enable detailed task event logging (impacts performance)
  max_task_retries: 3            # Maximum automatic task retries
  task_retry_delay_ms: 100       # Delay between task retries in milliseconds
  
  # Network and Communication - gRPC and communication settings
  grpc_max_message_size: 104857600  # 100MB max gRPC message size
  grpc_keepalive_time_ms: 30000  # gRPC keepalive time
  grpc_keepalive_timeout_ms: 5000  # gRPC keepalive timeout
  raylet_heartbeat_timeout_ms: 30000  # Raylet heartbeat timeout
  
  # Resource Monitoring and Limits - System monitoring
  enable_resource_monitoring: true  # Monitor resource usage
  resource_monitoring_interval_s: 1.0  # Resource monitoring interval
  enable_memory_monitor: true    # Monitor memory usage
  memory_monitor_refresh_ms: 250 # Memory monitor refresh rate
  enable_automatic_cleanup: true # Automatic cleanup of unused resources
  cleanup_interval_s: 60        # Resource cleanup interval
  
  # Worker and Actor Configuration - Worker management
  max_workers_per_process: 1     # Maximum workers per process
  enable_worker_preloading: false  # Preload workers for faster startup
  worker_startup_timeout_s: 30   # Worker startup timeout
  actor_lifetime_timeout_s: 3600 # Actor lifetime timeout (1 hour)
  
  # Debug and Development - Development and debugging features
  enable_debug_mode: false       # Enable debug mode with detailed logging
  profile_workers: false         # Enable worker profiling
  profile_output_dir: null       # Directory for profiling output
  enable_timeline: false         # Enable Ray timeline for debugging
  
  # Legacy memory management (kept for compatibility)
  memory_management:
    memory_usage_threshold: 0.98          # Ray OOM threshold (98%)
    memory_monitor_refresh_ms: 1000       # Memory monitoring frequency (1 second)
    enable_worker_killing: true           # Keep enabled but with higher threshold
    max_worker_memory_mb: 2048            # Max memory per Ray worker (2GB)
    enable_memory_pressure_eviction: true # Enable memory pressure-based object eviction
  
  # Ray Optimization Settings - Tối ưu Ray parallel processing cho ultra-scale
  optimization:
    # Deployment configuration - ULTRA SCALED with fractional CPU allocation
    deployment_batch_size: 100         # Increased batch size for better throughput
    deployment_batch_interval: 1.0    # Reduced interval for faster processing
    num_deployment_actors: 16         # INCREASED from 16 to 32 Ray actors (0.5 CPU each = 2x more actors per CPU)

    # Parallel processing limits - MASSIVELY SCALED UP
    max_concurrent_tasks_per_router: 10  # INCREASED from 20 to 100 (5x more concurrent tasks per router)
    max_parallel_predictions: 500         # INCREASED from 50 to 500 (10x more parallel predictions)


# 3. MLflow - Model registry và tracking
mlflow:
  tracking_uri: "http://localhost:5000"     # MLflow tracking server
  registry_uri: null                        # Model registry (có thể khác tracking)
  artifact_location: null                   # Local path lưu artifacts
  production_check_interval: 300           # Interval (seconds) to check for model updates in the MLflow registry

# =============================================================================
# PERFORMANCE & SCALING CONFIGURATIONS
# =============================================================================

# 7. Resource Sharing - Tối ưu resource utilization
resource_sharing:
  strategy: "gpu_shared"         # Strategies: none/cpu_only/gpu_shared/memory_mapped/full_sharing
  enable_memory_mapping: true    # Share model weights in memory
  enable_model_weight_sharing: true # Multiple models share same weights
  shared_memory_size: "1GB"     # Shared memory pool size

  # GPU optimization
  max_models_per_gpu: 0          # Max models per GPU card
  gpu_memory_reserve: 0.2        # Reserve 20% GPU memory cho system
  enable_dynamic_gpu_allocation: true # Dynamic GPU allocation

  # CPU optimization
  cpu_oversubscription_factor: 2.0 # Allow 2x CPU oversubscription
  enable_cpu_affinity: true       # Pin processes to CPU cores

  # Memory optimization
  enable_model_compression: true   # Compress models in memory
  compression_ratio: 0.7          # Target 70% original size

# 8. Routing Configuration
routing:
  strategy: "least_loaded"       # least_loaded/round_robin/fastest_response/model_affinity
  enable_request_queuing: true   # Enable request queuing
  max_queue_size: 1000          # Maximum queue size
  queue_timeout: 30             # Queue timeout in seconds


# =============================================================================
# SYSTEM CONFIGURATIONS
# =============================================================================

# 10. Monitoring Configuration
monitoring:
  collection_interval: 30       # Metrics collection interval (seconds)
  optimization_interval: 300    # Optimization interval (seconds)
  enable_prometheus_export: true # Enable Prometheus metrics export
  prometheus_port: 9090         # Prometheus metrics port
  update_interval: 20

  # Alert thresholds
  alert_thresholds:
    cpu_usage_percent: 80       # CPU usage alert threshold
    memory_usage_percent: 85    # Memory usage alert threshold
    gpu_usage_percent: 90       # GPU usage alert threshold
    response_time_ms: 5000      # Response time alert threshold
    error_rate_percent: 5       # Error rate alert threshold

# 11. Logging Configuration
logging:
  log_level: "DEBUG"
  log_dir: "logs"
  max_file_size: 104857600  # 100MB in bytes 
  backup_count: 5
  enable_console: true
  enable_structured: true
  enable_performance_tracking: true
  format: "[%(asctime)s][%(filename)s:%(lineno)d][%(levelname)s] %(message)s"

# 12. Security Configuration
security:
  enable_auth: false
  api_key: null  # Set via API_KEY environment variable
  allowed_origins: ["*"]
  rate_limit_requests_per_minute: 1000
  enable_https: false
  ssl_cert_path: null
  ssl_key_path: null
