api:
  # Host/port FastAPI (uvicorn)
  # Env override: FASTAPI_HOST hoặc API_HOST (back-compat)
  host: "0.0.0.0"
  # Env override: FASTAPI_PORT hoặc API_PORT (back-compat)
  port: 8000

  # Prefix/version tài liệu API
  prefix: "/api/v1"
  version: "v1.0"
  docs: true
  openapi: true